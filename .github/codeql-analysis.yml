# This workflow runs CodeQL security analysis for Java on every push and PR.
name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # Weekly scan at 3am on Monday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # If your Java build is not Maven/Gradle, add your custom build steps here
    - name: Build with Maven
      run: mvn install -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3